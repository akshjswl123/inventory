# compose.yaml
services:
  db:
    image: docker.io/postgres:16-alpine
    container_name: poc_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: poc
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: poc_secret
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./successquery.sql:/docker-entrypoint-initdb.d/02_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poc -d poc"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: docker.io/node:20-alpine
    container_name: poc_app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./server.js:/app/server.js:ro
      - ./dbqueries.js:/app/dbqueries.js:ro
      - ./package.json:/app/package.json:ro
      - ./index.html:/app/index.html:ro
      - ./report.js:/app/report.js:ro
      - ./successquery.sql:/app/successquery.sql
      - ./dumps:/app/dumps
      - ./catalog.js:/app/catalog.js:ro
      - node_modules:/app/node_modules
    environment:
      NODE_ENV: production
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: poc
      PGUSER: poc
      PGPASSWORD: poc_secret
    ports:
      - "3050:3000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "apk add --no-cache postgresql16-client && npm install --omit=dev && node server.js"

volumes:
  pg_data:
  node_modules: