# compose.yaml
services:
  db:
    image: docker.io/postgres:16-alpine
    container_name: poc_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: poc
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: poc_secret
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Schema + seed SQL run only on first init (empty volume). After edits run: docker compose down -v && docker compose up -d
      # Query tab "Recreate DB from Dump" drops & recreates POSTGRES_DB (poc) in this volume; app reconnects to the same name.
      - ./01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./scripts/seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
      - ./scripts/dish_scoops_seed.sql:/docker-entrypoint-initdb.d/03_dish_scoops_seed.sql:ro
      - ./scripts/raw_materials_seed.sql:/docker-entrypoint-initdb.d/04_raw_materials_seed.sql:ro
      - ./scripts/raw_materials_custom_scoops_seed.sql:/docker-entrypoint-initdb.d/05_custom_scoops_seed.sql:ro
      - ./scripts/28_mcp_reader_role.sql:/docker-entrypoint-initdb.d/06_mcp_reader_role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poc -d poc"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4_inventory
    restart: always
    ports:
      - "1000:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./databse-config.json:/pgadmin4/servers.json:ro

#  adminer:
#    image: adminer
#    container_name: adminer_inventory
#    restart: always
#    ports:
#      - "7001:8080"

#  cloudbeaver:
#    image: dbeaver/cloudbeaver:latest
#    container_name: cloudbeaver
#    restart: unless-stopped
#    ports:
#      - "8978:8978"
#    volumes:
#      - cloudbeaver_data:/opt/cloudbeaver/workspace


#  nocodb:
#    image: nocodb/nocodb:latest
#    container_name: nocodb_inventory
#    restart: always
#    ports:
#      - "1001:8080"
#    volumes:
#      - nocodb-data:/usr/app/data

  app:
    image: docker.io/node:20-alpine
    container_name: poc_app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./server.js:/app/server.js:ro
      - ./dbqueries.js:/app/dbqueries.js:ro
      - ./package.json:/app/package.json:ro
      - ./index.html:/app/index.html:ro
      - ./excelToCSV.html:/app/excelToCSV.html:ro
      - ./excelToCsv.js:/app/excelToCsv.js:ro
      - ./recreateFromPgDump.html:/app/recreateFromPgDump.html:ro
      - ./report.js:/app/report.js:ro
      - ./recipeCost.js:/app/recipeCost.js:ro
      - ./recipeCostQueries.js:/app/recipeCostQueries.js:ro
      - ./dishCostWalk.js:/app/dishCostWalk.js:ro
      - ./queryTranslator.js:/app/queryTranslator.js:ro
      - ./csv.js:/app/csv.js:ro
      - ./cataloghelper.js:/app/cataloghelper.js:ro
      - ./itemdetails.js:/app/itemdetails.js:ro
      - ./rawmaterials.js:/app/rawmaterials.js:ro
      - ./dishes.js:/app/dishes.js:ro
      - ./itemReport.js:/app/itemReport.js:ro
      - ./itemReportCsv.js:/app/itemReportCsv.js:ro
      - ./excelToCsvTab.js:/app/excelToCsvTab.js:ro
      - ./scoopUnitDefaultsBuilder.js:/app/scoopUnitDefaultsBuilder.js:ro
      - ./catalog.js:/app/catalog.js:ro
      - ./scoop_config_catalog.js:/app/scoop_config_catalog.js:ro
      - ./static_seed_catalog.js:/app/static_seed_catalog.js:ro
      - ./scoopStaticBuilders.js:/app/scoopStaticBuilders.js:ro
      - ./scoopConfigStore.js:/app/scoopConfigStore.js:ro
      - ./scoopDishLoader.js:/app/scoopDishLoader.js:ro
      - ./staticDataFetcher.js:/app/staticDataFetcher.js:ro
      - ./staticDataQueries.js:/app/staticDataQueries.js:ro
      - ./rawMaterialEstimator.js:/app/rawMaterialEstimator.js:ro
      - ./recipeWalkShared.js:/app/recipeWalkShared.js:ro
      - ./rawMaterialEstimatorCsv.js:/app/rawMaterialEstimatorCsv.js:ro
      - ./rawMaterialEstimatorTab.js:/app/rawMaterialEstimatorTab.js:ro
      - ./static_seed_core.js:/app/static_seed_core.js:ro
      - ./static_seed_materials.js:/app/static_seed_materials.js:ro
      - ./data:/app/data:ro
      - ./scripts:/app/scripts:ro
      - ./dumps:/dumps
      - node_modules:/app/node_modules
    environment:
      NODE_ENV: production
      PORT: 3000
      RUN_SEED_ON_STARTUP: "true"
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: poc
      PGMAINTDATABASE: postgres
      PGUSER: poc
      PGPASSWORD: poc_secret
    ports:
      - "3050:3000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "apk add --no-cache postgresql16-client && npm install --omit=dev && node server.js"

  excel-csv:
    image: docker.io/nginx:alpine
    container_name: excel_csv
    restart: unless-stopped
    ports:
      - "3051:80"
    volumes:
      - ./excel-csv/site:/usr/share/nginx/html:ro

  # MCP: read-only SQL (Streamable HTTP). Publish: MCP_HTTP_BIND:MCP_HTTP_PORT in .env (see .env.example).
  postgres-mcp:
    build:
      context: ./mcp
    image: inventory-postgres-mcp:local
    container_name: postgres-mcp
    restart: unless-stopped
    environment:
      POSTGRES_DSN: postgresql://mcp_reader:${MCP_READER_PASSWORD:-McpReadOnly_ChangeMe2026}@db:5432/poc
      PG_MCP_TRANSPORT: http
      PG_MCP_HOST: "0.0.0.0"
      PG_MCP_PORT: "8000"
      PG_MCP_READ_ONLY: "true"
      PG_MCP_MAX_ROWS: "2000"
      PG_MCP_STATEMENT_TIMEOUT_MS: "60000"
    ports:
      - "${MCP_HTTP_BIND:-127.0.0.1}:${MCP_HTTP_PORT:-5000}:8000"
    depends_on:
      db:
        condition: service_healthy

  # Cloudflare quick tunnel: ONE public *.trycloudflare.com URL per service below.
  # App URL does not include MCP — run tunnel-mcp for a second URL, then set MCP_SERVER_URL to https://<that-host>/mcp
  tunnel:
    build:
      context: ./mcp
      dockerfile: Dockerfile.cloudflared
    image: inventory-cloudflared-tunnel:local
    container_name: poc_tunnel
    restart: unless-stopped
    command: ["http://app:3000", "/runtime/app-tunnel.url"]
    volumes:
      - ./mcp/runtime:/runtime
    depends_on:
      - app

  tunnel-mcp:
    image: inventory-cloudflared-tunnel:local
    container_name: poc_tunnel_mcp
    restart: unless-stopped
    command: ["http://postgres-mcp:8000", "/runtime/mcp-tunnel.url"]
    volumes:
      - ./mcp/runtime:/runtime
    depends_on:
      - postgres-mcp

  # Named tunnel (custom hostnames, stable URLs): see mcp/cloudflare-ingress.example.yml

volumes:
  pg_data:
  node_modules:
  pgadmin-data:
  nocodb-data:
  cloudbeaver_data:
