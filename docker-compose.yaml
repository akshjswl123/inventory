# compose.yaml
services:
  db:
    image: docker.io/postgres:16-alpine
    container_name: poc_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: poc
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: poc_secret
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Schema + seed SQL run only on first init (empty volume). After edits run: docker compose down -v && docker compose up -d
      # Query tab "Recreate DB from Dump" drops & recreates POSTGRES_DB (poc) in this volume; app reconnects to the same name.
      - ./01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./scripts/seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
      - ./scripts/dish_scoops_seed.sql:/docker-entrypoint-initdb.d/03_dish_scoops_seed.sql:ro
      - ./scripts/raw_materials_seed.sql:/docker-entrypoint-initdb.d/04_raw_materials_seed.sql:ro
      - ./scripts/raw_materials_custom_scoops_seed.sql:/docker-entrypoint-initdb.d/05_custom_scoops_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poc -d poc"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4_inventory
    restart: always
    ports:
      - "1000:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./databse-config.json:/pgadmin4/servers.json:ro

#  adminer:
