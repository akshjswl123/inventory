  app:
    image: docker.io/node:20-alpine
    container_name: poc_app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./server.js:/app/server.js:ro
      - ./dbqueries.js:/app/dbqueries.js:ro
      - ./package.json:/app/package.json:ro
      - ./index.html:/app/index.html:ro
      - ./excelToCSV.html:/app/excelToCSV.html:ro
      - ./excelToCsv.js:/app/excelToCsv.js:ro
      - ./recreateFromPgDump.html:/app/recreateFromPgDump.html:ro
      - ./report.js:/app/report.js:ro
      - ./recipeCost.js:/app/recipeCost.js:ro
      - ./recipeCostQueries.js:/app/recipeCostQueries.js:ro
      - ./dishCostWalk.js:/app/dishCostWalk.js:ro
      - ./queryTranslator.js:/app/queryTranslator.js:ro
      - ./csv.js:/app/csv.js:ro
      - ./cataloghelper.js:/app/cataloghelper.js:ro
      - ./itemdetails.js:/app/itemdetails.js:ro
      - ./rawmaterials.js:/app/rawmaterials.js:ro
      - ./dishes.js:/app/dishes.js:ro
      - ./itemReport.js:/app/itemReport.js:ro
      - ./itemReportCsv.js:/app/itemReportCsv.js:ro
      - ./excelToCsvTab.js:/app/excelToCsvTab.js:ro
      - ./scoopUnitDefaultsBuilder.js:/app/scoopUnitDefaultsBuilder.js:ro
      - ./catalog.js:/app/catalog.js:ro
      - ./scoop_config_catalog.js:/app/scoop_config_catalog.js:ro
      - ./static_seed_catalog.js:/app/static_seed_catalog.js:ro
      - ./scoopStaticBuilders.js:/app/scoopStaticBuilders.js:ro
      - ./scoopConfigStore.js:/app/scoopConfigStore.js:ro
      - ./scoopDishLoader.js:/app/scoopDishLoader.js:ro
      - ./staticDataFetcher.js:/app/staticDataFetcher.js:ro
      - ./staticDataQueries.js:/app/staticDataQueries.js:ro
      - ./scripts:/app/scripts:ro
      - ./dumps:/dumps
      - node_modules:/app/node_modules
    environment:
      NODE_ENV: production
      PORT: 3000
      RUN_SEED_ON_STARTUP: "true"
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: poc
      PGMAINTDATABASE: postgres
      PGUSER: poc
      PGPASSWORD: poc_secret
    ports:
      - "3050:3000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "apk add --no-cache postgresql16-client && npm install --omit=dev && node server.js"

  excel-csv:
    image: docker.io/nginx:alpine
    container_name: excel_csv
    restart: unless-stopped
    ports:
      - "3051:80"
    volumes:
      - ./excel-csv/site:/usr/share/nginx/html:ro

