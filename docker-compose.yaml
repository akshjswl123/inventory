# compose.yaml
services:
  db:
    image: docker.io/postgres:16-alpine
    container_name: poc_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: poc
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: poc_secret
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./successquery.sql:/docker-entrypoint-initdb.d/02_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poc -d poc"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4_inventory
    restart: always
    ports:
      - "1000:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./databse-config.json:/pgadmin4/servers.json:ro

  #  adminer:
  #    image: adminer
  #    container_name: adminer_inventory
  #    restart: always
  #    ports:
  #      - "7001:8080"

  #  cloudbeaver:
  #    image: dbeaver/cloudbeaver:latest
  #    container_name: cloudbeaver
  #    restart: unless-stopped
  #    ports:
  #      - "8978:8978"
  #    volumes:
  #      - cloudbeaver_data:/opt/cloudbeaver/workspace


  #  nocodb:
  #    image: nocodb/nocodb:latest
  #    container_name: nocodb_inventory
  #    restart: always
  #    ports:
  #      - "1001:8080"
  #    volumes:
  #      - nocodb-data:/usr/app/data

  app:
    image: docker.io/node:20-alpine
    container_name: poc_app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./server.js:/app/server.js:ro
      - ./dbqueries.js:/app/dbqueries.js:ro
      - ./package.json:/app/package.json:ro
      - ./index.html:/app/index.html:ro
      - ./report.js:/app/report.js:ro
      - ./queryTranslator.js:/app/queryTranslator.js:ro
      - ./csv.js:/app/csv.js:ro
      - ./cataloghelper.js:/app/cataloghelper.js:ro
      - ./itemdetails.js:/app/itemdetails.js:ro
      - ./rawmaterials.js:/app/rawmaterials.js:ro
      - ./dishes.js:/app/dishes.js:ro
      - ./catalog.js:/app/catalog.js:ro
      - ./staticDataFetcher.js:/app/staticDataFetcher.js:ro
      - ./staticDataQueries.js:/app/staticDataQueries.js:ro
      - ./scripts:/app/scripts:ro
      - node_modules:/app/node_modules
    environment:
      NODE_ENV: production
      PORT: 3000
      RUN_SEED_ON_STARTUP: "true"
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: poc
      PGUSER: poc
      PGPASSWORD: poc_secret
    ports:
      - "3050:3000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "apk add --no-cache postgresql16-client && npm install --omit=dev && node server.js"

volumes:
  pg_data:
  node_modules:
  pgadmin-data:
  nocodb-data:
  cloudbeaver_data:
